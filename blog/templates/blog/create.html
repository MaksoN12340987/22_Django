{% extends 'blog/base.html' %}

{% block title %}
    Создание поста
{% endblock %}

{% block page_title %}
    <h1>Создание поста</h1>
{% endblock %}

{% block content %}
    <div class="row">

        <div class="col-8 bg-gray">
            <div class="card rounded-3 ms-2 me-2 p-2 text-start">
                <form method="post">
                    
                    {% csrf_token %}
                    
                    <div class="mb-3">
                      <label for="id_title" class="form-label">Заголовок</label>
                      <input type="text" name="title" value="1" maxlength="200" required id="id_title" class="form-control">
                    </div>
                    
                    <div class="mb-3">
                      <label for="id_content" class="form-label">Содержимое:</label>
                      <textarea name="content" cols="40" rows="10" id="id_content" class="form-control"></textarea>
                    </div>
        
                    <div class="mb-3">
                        <label for="id_content" class="form-label">Количество просмотров:</label>
                        <input type="number" name="number_views" value="1" aria-describedby="id_number_views_helptext" id="id_number_views">
                        <span class="helptext" id="id_number_views_helptext">Количество просмотров</span>
                    </div>
                    
                    <div class="mb-3 form-check">
                      <input type="checkbox" class="form-check-input" id="exampleCheck1">
                      <label class="form-check-label" for="exampleCheck1">Проверить меня</label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Отправить</button>
                  
                </form>
        
            </div>
        </div>

        <div class="col-4">

        </div>

    </div>
{% endblock %}


{% block bottom %}

{% endblock %}
