<!-- catalog\templates\catalog\base.html -->
{% extends 'catalog/base.html' %}

{% block title %}
  Заказы
{% endblock %}

{% block page_title %}
  <h1>Заказы</h1>
{% endblock %}

{% block content %}
  <div class="container-fluid text-center p-4 vh-100">
      <div class="row row-cols-3">
        
        {% for product in products %}
          <div class="col mb-5">
              <div class="card rounded-3 ms-4 me-4">
                  <div class="card-header">
                    {{ product.name }}
                    </div>
                    <div class="card-body">
                      <img src="../../media/{{ product.image }}" class="card-img-top p-3" alt="...">
                      <form method="get">
                        {% csrf_token %}
                        <a href="{% url 'catalog:delete' product.pk %}" class="btn btn-danger">Удалить из карзины</a>
                      </form>
                  </div>
              </div>
          </div>
        
        {% endfor %}
      </div>
  </div>

{% endblock %}
