<!-- catalog\templates\catalog\base.html -->
{% extends 'catalog/base.html' %}

{% block title %}
  Заказ товаров
{% endblock %}

{% block page_title %}
  <div class="container-fluid vh-100 text-center p-4">
    <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
      
      <h4 class="display-4">Вы уверены, что хотите удалить "{{ products.name }}" из карзины?</h4>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить товар</button>
      </form>
      
      <a href="{% url 'catalog:orders' %}">
        <h6>Возврат в карзину</h6>
      </a>               
    
    </div>
  </div>
{% endblock %}
